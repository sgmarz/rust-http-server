[package]
name = "http-server"
version = "1.1.14"
edition = "2024"

[[bin]]
name = "http-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0" }
rustls = { version = "0" }
markdown = { version = "1" }
